<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset Sent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f3f4f6;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      width: min(420px, 90vw);
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      text-align: center;
    }
    h2 { margin-top: 0; }
    p { color: #d1d5db; }
    a { color: #93c5fd; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Check your email</h2>
    <p>We’ve sent you a password reset link. Please follow the instructions in the message.</p>
    <p><a href="{% url 'login' %}">Return to login</a></p>
  </div>
</body>
</html>
